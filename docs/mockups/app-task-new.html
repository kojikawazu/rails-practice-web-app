<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク作成 — Rails Task App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop-frame">
    <nav class="sidebar">
      <div class="sidebar-header">Rails Task App</div>
      <div class="sidebar-nav">
        <a href="app-projects.html" class="sidebar-item active">📁 プロジェクト</a>
      </div>
      <div class="sidebar-footer">
        <div class="flex gap-sm" style="align-items:center;">
          <div class="avatar">山</div>
          <div style="font-size:13px;">山田太郎</div>
        </div>
      </div>
    </nav>

    <div class="desktop-main">
      <div class="desktop-topbar">
        <div>
          <div style="font-size:12px; margin-bottom:4px;"><a href="app-project-show.html">← Webサイトリニューアル</a></div>
          <h1>タスク作成</h1>
        </div>
      </div>
      <div class="desktop-content">
        <div class="card" style="max-width:600px;">
          <form onsubmit="event.preventDefault(); alert('タスクを作成しました（モック）'); location.href='app-project-show.html';">
            <div class="form-group">
              <label>タイトル <span style="color:var(--color-red)">*</span></label>
              <input type="text" class="input" placeholder="タスク名を入力（200文字以内）">
            </div>
            <div class="form-group">
              <label>ステータス <span style="color:var(--color-red)">*</span></label>
              <select class="select">
                <option value="not_started" selected>未着手</option>
                <option value="in_progress">進行中</option>
                <option value="completed">完了</option>
              </select>
            </div>
            <div class="flex gap-sm">
              <div class="form-group" style="flex:1;">
                <label>開始日</label>
                <input type="text" class="input" placeholder="YYYY-MM-DD（flatpickr）">
              </div>
              <div class="form-group" style="flex:1;">
                <label>終了日</label>
                <input type="text" class="input" placeholder="YYYY-MM-DD（flatpickr）">
              </div>
            </div>
            <div class="flex gap-sm" style="margin-top:24px;">
              <button type="submit" class="btn btn-primary">作成する</button>
              <button type="button" class="btn" onclick="location.href='app-project-show.html'">キャンセル</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="screen-label">app-task-new.html · /projects/:project_id/tasks/new</div>
</body>
</html>
