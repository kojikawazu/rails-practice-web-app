<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — Rails Task App</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .error-container { text-align: center; max-width: 400px; padding: 0 24px; }
    .error-code { font-size: 80px; font-weight: 800; color: var(--color-primary-light); line-height: 1; }
    .error-title { font-size: 24px; font-weight: 700; margin-top: 16px; }
    .error-desc { color: var(--color-text-sub); margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <div class="error-title">ページが見つかりません</div>
    <p class="error-desc">お探しのページは存在しないか、移動した可能性があります。</p>
    <div style="margin-top:32px;">
      <a href="app-projects.html" class="btn btn-primary">トップページへ戻る</a>
    </div>
    <p class="mt-lg"><a href="index.html" style="font-size:13px; color:var(--color-text-muted);">← 画面一覧に戻る</a></p>
  </div>
  <div class="screen-label">error-404.html · /404</div>
</body>
</html>
