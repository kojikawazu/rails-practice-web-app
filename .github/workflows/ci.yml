name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # 変更範囲を1か所で判定する軽量ジョブ。
  # 変更内容に関係のあるジョブだけを動かすための入口（.claude/rules/github-actions.md）。
  #   code=true  -> テスト（test / system-js）を実行する
  #   docs=true  -> markdown lint を実行する
  # 下流ジョブはワークフローレベルの paths ではなく if 条件でスキップする。
  # skip されたジョブは required check 上では成功扱いになるため、
  # ブランチ保護を有効にしてもマージが pending で止まらない。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 「コードとは何か」を positive パターンで列挙する（取りこぼさない安全側）。
          # ここに該当しない変更（docs/**, **.md, README, .claude/** 等）は code=false。
          # アプリ配下・workflow 配下の AGENTS.md はルール文書なので、明示的に除外する。
          # docs は markdown ファイルと lint 設定そのものを対象にする。
          # 両方に該当する変更（アプリ配下の *.md 等）では両方が動く。
          filters: |
            code:
              - 'rails-task-fullstack-web-app/**'
              - '!rails-task-fullstack-web-app/**/AGENTS.md'
              - 'rails-task-api-web-app/**'
              - '!rails-task-api-web-app/**/AGENTS.md'
              - '.github/workflows/**'
              - '!.github/workflows/**/AGENTS.md'
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - '.github/workflows/**'

  # ドキュメント変更時の軽量チェック。
  # 「ドキュメント変更でも何も動かさない、にはしない」（.claude/rules/github-actions.md）。
  markdown-lint:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 設定は .markdownlint-cli2.jsonc（ローカルの make lint-md と同一）。
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

  test:
    name: Test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rails-task-fullstack-web-app, rails-task-api-web-app]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails_task
          POSTGRES_PASSWORD: password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rails_task"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_USER: rails_task
      POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: ${{ matrix.app }}

      - name: Prepare test DB
        working-directory: ${{ matrix.app }}
        run: bin/rails db:test:prepare

      - name: Minitest
        working-directory: ${{ matrix.app }}
        run: bin/rails test

      - name: RSpec
        working-directory: ${{ matrix.app }}
        run: bundle exec rspec

  system-js:
    name: System (:js, headless Chrome)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails_task
          POSTGRES_PASSWORD: password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rails_task"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_USER: rails_task
      POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: rails-task-fullstack-web-app

      - name: Prepare test DB
        working-directory: rails-task-fullstack-web-app
        run: bin/rails db:test:prepare

      - name: RSpec (:js system specs)
        working-directory: rails-task-fullstack-web-app
        run: bundle exec rspec --tag js
