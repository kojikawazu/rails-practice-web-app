name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # コード変更の有無を1か所で判定する軽量ジョブ。
  # doc のみ（docs/** や **.md）の変更では code=false となり、
  # 下流の重いジョブは if 条件でスキップされる。
  # skip されたジョブは required check 上では成功扱いになるため、
  # ブランチ保護を有効にしてもマージがブロックされない。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 「コードとは何か」を positive パターンで列挙する（取りこぼさない安全側）。
          # ここに該当しない変更（docs/**, **.md, README, .claude/** 等）は code=false。
          filters: |
            code:
              - 'rails-task-fullstack-web-app/**'
              - 'rails-task-api-web-app/**'
              - '.github/workflows/**'

  test:
    name: Test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rails-task-fullstack-web-app, rails-task-api-web-app]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails_task
          POSTGRES_PASSWORD: password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rails_task"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_USER: rails_task
      POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: ${{ matrix.app }}

      - name: Prepare test DB
        working-directory: ${{ matrix.app }}
        run: bin/rails db:test:prepare

      - name: Minitest
        working-directory: ${{ matrix.app }}
        run: bin/rails test

      - name: RSpec
        working-directory: ${{ matrix.app }}
        run: bundle exec rspec

  system-js:
    name: System (:js, headless Chrome)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails_task
          POSTGRES_PASSWORD: password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rails_task"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_USER: rails_task
      POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: rails-task-fullstack-web-app

      - name: Prepare test DB
        working-directory: rails-task-fullstack-web-app
        run: bin/rails db:test:prepare

      - name: RSpec (:js system specs)
        working-directory: rails-task-fullstack-web-app
        run: bundle exec rspec --tag js
