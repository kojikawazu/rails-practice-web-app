name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # 変更範囲を1か所で判定する軽量ジョブ。
  # 変更内容に関係のあるジョブだけを動かすための入口（.claude/rules/github-actions.md）。
  #   code=true  -> 静的解析・セキュリティ検査（lint-security）とテスト（test / system-js）を実行する
  #   docs=true  -> markdown lint を実行する
  # 下流ジョブはワークフローレベルの paths ではなく if 条件でスキップする。
  # skip されたジョブは required check 上では成功扱いになるため、
  # ブランチ保護を有効にしてもマージが pending で止まらない。
  #
  # 代表パスの期待判定は .github/scripts/verify-path-filters.mjs が正本で、
  # このジョブ内で実際に検証する（期待表をコメントで二重に持つと乖離するため）。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      # コード判定は「除外リスト」で書く（.claude/rules/github-actions.md）。
      # 「対象リスト」で書くと、新しいディレクトリが増えたときに黙ってテストが走らなくなる。
      # ドキュメント・ルール以外は未知のパスも含めてすべてテストへ流し、安全側に倒す。
      #
      # predicate-quantifier: every は「すべてのパターンに一致したファイルだけを対象にする」
      # 指定。既定の some（どれか 1 つに一致）のままだと、否定パターン単体が
      # 「md 以外のすべて」に一致してしまい除外として機能しない。
      - uses: dorny/paths-filter@v3
        id: code
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!.markdownlint-cli2.jsonc'

      # ドキュメント側は対象リストでよい（漏れても「lint が走らない」だけで、
      # 未検証のコードがマージされる方向には倒れない）。
      # docs/ 配下の画像や .claude/ のルールなど md 以外の変更でも、
      # 「ドキュメント変更で何も動かさない」を避けるため markdown lint を回す。
      # package.json / package-lock.json は markdownlint のバージョンを決めるため、
      # 更新時に新バージョンで全 md が通るかを確かめる（code 側にも依存関係として流れる）。
      - uses: dorny/paths-filter@v3
        id: docs
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.claude/**'
              - '.markdownlint-cli2.jsonc'
              - 'package.json'
              - 'package-lock.json'

      # 代表パスの分類が期待どおりかを、paths-filter と同じ picomatch で検証する。
      # フィルタを書き換えて分類が崩れたら、下流のテストより先にここで落とす。
      # picomatch / js-yaml はルートの package-lock.json で固定したバージョンを使う。
      - name: Verify filter classification
        run: |
          npm ci --silent
          npm run verify:path-filters

      # 今回の変更がどちらに分類されたかをジョブサマリに残す（レビューで追えるようにする）。
      - name: Summarize classification
        run: |
          {
            echo "| 判定 | 値 | 起動するジョブ |"
            echo "|---|---|---|"
            echo "| code | ${{ steps.code.outputs.code }} | Lint & Security / Test / System (:js) |"
            echo "| docs | ${{ steps.docs.outputs.docs }} | Markdown lint |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ドキュメント変更時の軽量チェック。
  # 「ドキュメント変更でも何も動かさない、にはしない」（.claude/rules/github-actions.md）。
  markdown-lint:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # バージョンは package-lock.json、対象と設定は .markdownlint-cli2.jsonc で固定する。
      # ローカルの make lint-md と同じコマンドを使う（npx で最新版を引くと、上流のリリースだけで CI が落ちる）。
      - name: Install tooling
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  # 鍵ファイルの再混入を防ぐガード。
  # master.key は一度 push すると履歴から消せず、鍵のローテーション以外に対処手段が
  # なくなる（docs/06-security-specification.md「鍵のローテーション」）。
  # .gitignore は未追跡ファイルにしか効かないため、追跡された時点で落とす検出側も要る。
  # 変更種別を問わず常に実行する（どの分類の変更でも混入しうるため）。
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no key files are tracked
        run: |
          tracked=$(git ls-files -- '*.key' '*.pem')
          if [ -n "$tracked" ]; then
            echo "::error::鍵ファイルが Git 管理下にあります。.gitignore への追加では履歴から消えないため、鍵のローテーションが必要になります。"
            echo "$tracked"
            exit 1
          fi
          echo "OK: 追跡対象に鍵ファイルはありません"

  # 静的解析とセキュリティ検査（.claude/rules/static-analysis.md / ruby.md で CI 必須）。
  # DB を使わないため test とは別ジョブにし、並列に走らせて失敗原因をジョブ名で区別する。
  # コマンドはローカルの make lint / make security と同じ判定に揃える。
  #
  # bundler-audit は実行時点の最新アドバイザリで照合するため、新しい脆弱性が公表されると
  # 無関係なコード変更の PR でも落ちる。Dependabot の修正 PR を放置したまま脆弱な
  # Gemfile.lock を使い続けないための意図した挙動（#112 で 74 件溜まった反省）。
  lint-security:
    name: Lint & Security (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rails-task-fullstack-web-app, rails-task-api-web-app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        id: setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: ${{ matrix.app }}

      - name: RuboCop
        working-directory: ${{ matrix.app }}
        run: bin/rubocop

      # 前段の検査が落ちても後続の検査結果を見られるよう、各検査は独立して実行する。
      # ただしセットアップ失敗時は検査できないため走らせない（無関係なエラーを重ねない）。
      - name: bundler-audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ${{ matrix.app }}
        run: bin/bundler-audit check --update

      # bin/brakeman は Rails 既定で --ensure-latest を付けるため、Brakeman 本体が最新版で
      # なければ警告ゼロでも exit 5 で落ちる。新しい検出ルールを取りこぼさないために維持し、
      # 落ちたら bundle update --conservative brakeman で追従する。
      - name: Brakeman
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ${{ matrix.app }}
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  test:
    name: Test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rails-task-fullstack-web-app, rails-task-api-web-app]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails_task
          POSTGRES_PASSWORD: password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rails_task"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_USER: rails_task
      POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: ${{ matrix.app }}

      - name: Prepare test DB
        working-directory: ${{ matrix.app }}
        run: bin/rails db:test:prepare

      - name: RSpec
        working-directory: ${{ matrix.app }}
        run: bundle exec rspec

  system-js:
    name: System (:js, headless Chrome)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails_task
          POSTGRES_PASSWORD: password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rails_task"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_USER: rails_task
      POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: rails-task-fullstack-web-app

      - name: Prepare test DB
        working-directory: rails-task-fullstack-web-app
        run: bin/rails db:test:prepare

      - name: RSpec (:js system specs)
        working-directory: rails-task-fullstack-web-app
        run: bundle exec rspec --tag js
